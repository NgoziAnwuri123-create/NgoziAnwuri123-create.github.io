# Remote theme directory
remote_theme: analytics-link/analytics-link.github.io

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-remote-theme

#-------------------------------
# General Site Settings
title: Ngozi Anwuri
description: "Hi I'm Ngozi, and I'm a Data analytics professional.  My portfolio focuses on interesting projects I have recently undertaken, with a strong emphasis on business impact. Please visit my Github & LinkedIn pages (or download my Resume) by using the links below!"
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com

#-------------------------------
# About Section
subtitle: Data Science| Analytics Consultant | ML & AI <span style="color:#f58506"> Portfolio </span>
location: "London, UK"
resume_url: /docs/Ngozi_Anwuri_ CV.pdf
avatar_image: /img/ngozi2.jpg

#-------------------------------
# Contact links
linkedln: https://www.linkedin.com/in/ngozi-a-66a93812/
github: https://github.com/NgoziAnwuri123-create

paginate: 6
paginate_path: "/page/:num"

sass:
  sass_dir: _sass
  style: compressed # possible values: nested expanded compact compressed

defaults:
  - scope:
      type: posts
    values:
      layout: post
      read_time: true
      share: false


